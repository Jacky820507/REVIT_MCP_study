title: "明細表\n參數表"
tooltip: "複選明細表（可關鍵字篩選、Shift 連選），把明細表裡的元素與欄位攤成一張可編輯表格，跟「房間參數表」同一套操作：直接改文字/數值、Shift/Ctrl 選多格、Ctrl+C/V（可從 Excel 貼一整片，單一值貼滿選取範圍）、Ctrl+D 向下填滿、Delete 清空、匯出/匯入 Excel（以 ElementId 對回元素）。唯讀參數、計算值、Count 等非參數欄位不顯示或灰底只顯示；標「（類型）」的欄寫到元素的類型上，同一類型在不同列被改成不同值時會擋下來要你統一。關閉表格後先 dry-run 預覽，確認才在單一 Transaction 寫入，任一格失敗就整批回復並帶著修改重開表格。"
author: "RevitMCP"
