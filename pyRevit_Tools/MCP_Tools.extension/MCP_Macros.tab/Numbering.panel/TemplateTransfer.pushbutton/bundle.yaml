title: "樣板移轉"
tooltip: "把視圖樣板從別的 Revit 檔案複製到目前檔案。兩種進入方式：**先輸入關鍵字**（JAC 11.02）跨已開啟的檔案搜尋，或**先選來源模型**（JAC 11.03，可選已開啟的檔或從 .rvt 檔案挑）。關鍵字多詞以空格分隔，**每個詞都要命中**（縮小而非擴大）；清單依視圖類型分組——平面樣板套不到剖面圖。**同名樣板無法被覆寫**：Revit 的 `DuplicateTypeAction` 只提供「沿用目標既有」或「中止」，沒有取代；因此複製前先檢出同名者並**預設略過**，選「仍然複製」時新樣板的名稱由 Revit 決定（通常加後綴）。從檔案開啟來源時會先以路徑比對已開啟的文件，**只關閉本按鈕自己開的檔**，不會動到使用者原本開著的檔案。dry-run 預覽後才複製，單一 Transaction 全有全無。"
