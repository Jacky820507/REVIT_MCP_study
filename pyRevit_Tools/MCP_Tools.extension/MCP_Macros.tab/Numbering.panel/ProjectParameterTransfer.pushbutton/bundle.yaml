title: "專案參數移轉"
tooltip: "把專案參數（含綁定的品類與實體／類型設定）從別的 Revit 檔案移轉到目前檔案，可依名稱關鍵字、品類、綁定種類篩選。**只有共用參數能跨檔移轉**——`Definition` 屬於擁有它的文件，目標必須拿到一個 Revit 認得是「同一個參數」的新定義，而那個身分就是 GUID，只有共用參數才有。非共用的專案參數 API 無法在其他檔案建立，會列出並說明原因而**不代為改建成共用參數**（共用參數可被標籤、可跨族群排程，性質不同）。移轉時以**相同 GUID** 在暫存共用參數檔重建定義，因此 Revit 視為同一個參數。`SharedParametersFilename` 是整個 session 的設定，本按鈕用完會在 finally 還原並刪除暫存檔。目標已綁同 GUID、或已有同名但不同 GUID 者一律略過。從檔案開來源時先以路徑比對已開啟文件，只關閉本按鈕自己開的檔。dry-run 預覽後才寫入，單一 Transaction 全有全無。"
