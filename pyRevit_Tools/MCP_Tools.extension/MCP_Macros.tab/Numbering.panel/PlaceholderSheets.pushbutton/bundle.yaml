title: "佔位圖紙轉正式圖紙"
tooltip: "把「圖紙清單」明細表新增列所產生的佔位圖紙（placeholder sheet）批次轉成正式圖紙。Revit 原生只能右鍵一張一張轉，八十列的圖紙清單就是八十次對話框。範圍可用目前選取的圖紙，或從全部佔位圖紙中複選；清單依圖號自然排序（A-2 在 A-10 前）並依前綴分組，方便「A- 開頭用 A1 圖框、S- 開頭用 A3」分兩次跑。圖號或圖名空白者會先提醒但不阻擋。dry-run 預覽後才執行，單一 Transaction 全有全無，任一張失敗則全部保持原狀。注意：Revit API 無法讀取明細表中反白的儲存格範圍，因此範圍由選取或清單決定。"
