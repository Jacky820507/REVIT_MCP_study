title: "明細表\n欄位編輯"
tooltip: "複選明細表（可關鍵字篩選、Shift 連選），開啟跟 Revit「明細表性質 > 欄位」同概念的雙欄編輯器：左邊明細表清單、中間可用欄位、右邊明細表欄位。可加入/移除欄位（雙擊也可）、上移下移/移到最上最下；右側是可直接編輯的表格，欄位標題直接改、勾選「隱藏」或選多列按「隱藏選取／取消隱藏選取」批次切換；可用欄位裡同名參數標示（類型）以區分實例/類型；每張明細表各自編輯，也可把一張的欄位設定（欄位、順序、標題）複製到其他張，目標沒有的欄位會略過並列出。計算值欄位移除後只能在本次復原。關閉後先列出 dry-run 預覽，移除的欄位若被篩選或排序/組成群組使用會警告並一併刪除；確認才在單一 Transaction 寫入，任一張失敗就整批回復並帶著修改重開編輯器。"
author: "RevitMCP"
