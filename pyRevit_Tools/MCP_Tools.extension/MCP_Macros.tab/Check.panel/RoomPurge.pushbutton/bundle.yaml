title: "自動清除房間"
tooltip: "清除「未涵蓋房間」——未放置（Location 為 None）與未封閉（已放置但面積為 0）。這兩種房間仍帶著編號與名稱、仍出現在每一張明細表，卻不出現在任何圖面上，所以通常要等到面積表跑出一堆沒有面積的列才被發現。開啟 WPF 視窗，預設只勾選這兩種；其餘房間也全部列出供手動複選，可依狀態篩選與搜尋編號／名稱，切換篩選不會遺失已勾選的項目。冗餘房間（同一封閉區域有多個房間）會列出但不預設勾選——哪一個才是要留的只有你知道。狀態取自 Revit 自己的警告 GUID，不比對訊息文字。刪除前預設先匯出房間清單備份；存檔對話框按取消則連刪除一併取消。單一 Transaction 全有全無，失敗時房間全部保留。"
