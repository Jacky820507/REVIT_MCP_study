title: "無障礙樓梯數量檢核"
tooltip: "以單一視窗檢核建築技術規則建築設計施工編 §167-2「建築物設置之直通樓梯，至少應有一座為無障礙樓梯」。五個條件（是否適用第十章、分棟方式、避難層、哪個參數／哪些值代表無障礙、304.1 或 304.4、樓梯合併容差）全部在同一頁設定，改任一項按「執行檢核」即可重跑，不必從頭回答一遍。結果分「檢核結果」（逐棟判定卡片）與「樓梯明細」兩頁。會把上下層樓梯歸併成一座再判斷，只計算通達避難層者。**已標示為無障礙但級高／級深／2R+T／露空式（`STAIRS_ATTR_RISERS_PRESENT`）不符規範 304 者不計入數量**——標示不等於合格，並可一鍵選取那些樓梯。旋轉／扇形梯段列為需人工確認，該棟結論為「無法判定」而非合格。唯讀，不寫入模型。扶手（305）、警示設施（306）、平台高差（303.3）不在檢核範圍。"
