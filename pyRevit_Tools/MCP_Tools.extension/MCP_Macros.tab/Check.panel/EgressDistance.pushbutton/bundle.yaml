title: "步行距離檢核"
tooltip: "依建築技術規則建築設計施工編 §93 二檢核自居室任一點至樓梯口的步行距離。條文明定是「隔間後之可行距離非直線距離」，所以這裡把樓層的可走空間格網化後做多源 Dijkstra，量的是繞過隔間真正要走的路——直線量法會把不合格的平面判成合格。可走空間取自房間邊界，門的位置會補上連通區域把相鄰兩室接起來。量測終點可選「直通樓梯之第一階」（自動取樓梯輪廓）或「進入樓梯間之防火門」（安全梯，手動指定門），依 §93 末項。容許值由用途類組與三個條件決定（第十五層以上、集合住宅複層式無出入口樓層、非防火構造），這四項模型讀不到，一律由你指定。格網距離會略為高估（偏嚴不偏鬆，不修正）；走不到樓梯的房間獨立列為「無法到達」而非合格。§95 二座樓梯路徑重複部分只報門檻不量測。唯讀，不寫入模型。"
