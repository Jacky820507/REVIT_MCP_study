title: "門窗圖例＋參數"
tooltip: "自動完成門窗圖：把選定的門窗類型放進圖例視圖，並在每個元件下方列出你勾選的參數。依 domain/door-window-legend-workflow.md 的方法——**Revit API 無法直接建立圖例元件**，只能「放一個 seed → 複製 → 改它的 LEGEND_COMPONENT 參數」；反射確認該參數在 2020/2024 都存在，所以 32 個類型只需要點一次而不是 32 次。顯示方向與細緻度跟著 seed 複製，要立面圖例就把 seed 設成立面。圖例元件無法被 tag，參數只能寫成 TextNote。**底部對齊**：同列元件的邊界框底緣同高——置中會讓窗台浮在不同高度、置頂會讓門懸空。**平均展開**量的是邊界之間的空隙而非中心距，否則寬元件會幾乎貼在一起。依 domain 規定，圖例視圖、seed 來源與排版方向都必須由你明確指定，本工具不代選。預設只列模型裡真的有放置的類型。寫入前先預覽，單一交易全有全無。"
