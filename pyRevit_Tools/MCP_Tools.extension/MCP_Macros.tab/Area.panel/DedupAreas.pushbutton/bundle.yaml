title: "清除重複區域線及面積"
tooltip: "一次清掉面積平面圖上的兩種重複：**重複面積**（同一封閉區域裡有兩個以上的 Area）與**重複區域線**（畫在同一位置的線）。重複面積的偵測來自 Revit 自己的警告 `RoomsInSameRegionAreas`，不是自行以幾何推導；重複區域線沿用「區域線重新生成」第三模式的同一套 `plan_dedup`（同一個函式，不是另一份複製）。**保留哪一個只在「不需要選擇」時才代為決定**：一組裡只有一個有編號或名稱、其餘空白時，有資料的那個顯然是人做的；**兩個都有資料時整組不動**——那是同一個空間的兩份紀錄，刪掉哪個都會失去東西，沒有預設會比擲硬幣好。都沒有資料時保留 element id 最小者：任意但穩定，重跑會收斂而不是每次換一個倖存者。刪除順序固定先面積後區域線（仍在界定面積的線正是 Revit 會抱怨的對象）。預設先匯出面積清單備份；存檔對話框按取消則連刪除一併取消。單一 Transaction 全有全無。"
