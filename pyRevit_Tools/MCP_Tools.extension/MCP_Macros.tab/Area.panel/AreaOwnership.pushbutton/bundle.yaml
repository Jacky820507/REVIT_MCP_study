title: "專有共用面積類型"
tooltip: "依公寓大廈管理條例 §3 的法定定義，為面積提出專有／共用的建議分類，並可一併寫入大公／小公。選面積計畫→選寫入的參數（專有／共用、大公／小公）→選是否覆寫已有值→dry-run→寫入。**這是建議，不是法律認定**：§3 的專有判準是「使用上之獨立性」與「區分所有之標的」，名稱只是線索。**約定專用／約定共用永遠不會被自動判定**——兩者的定義都含「經約定」，約定在規約裡而不在模型裡。**名稱未命中關鍵字者列為「待確認」而非「共用」**：§3 雖然把共用定義成專有的補集，但關鍵字沒命中不是證據，填下去等於把漏判包裝成判定。已有值預設保留（那多半是人工判定過的，比關鍵字可信）。關鍵字採最長匹配，所以結果不隨使用者調整清單順序而改變。另：**Area Type 只存在於內建的「總建築面積」面積計畫**（以 `AreaScheme.IsGrossBuildingArea` 判斷），自訂計畫沒有這個概念，按鈕會直接說明而不是回報讀取失敗。方法與條文出處見 `domain/exclusive-shared-area-classification.md`。單一 Transaction 全有全無。"
