title: "CAD轉區域線"
tooltip: "把匯入或連結的 CAD（DWG／DXF）指定圖層的線段轉成面積區域線。選目標面積平面圖→選 CAD→複選圖層（清單顯示每層條數與總長，方便認出哪層是牆心線）→設長度下限與重複容差→選是否先清除既有區域線→dry-run→建立。**DWG 的 LWPOLYLINE 會被拆成 Line 段**（Revit 給的是 PolyLine 座標串而非 Curve），重複頂點造成的零長度段自動略過。三道過濾各自回報條數而非默默丟掉：長度低於下限（修剪殘留）、與同批重複（同一面牆畫兩次，比對不分方向）、型別不支援（雲線／橢圓——一律略過而不自動打斷成數百條短線）。圖層可跨層去重。建立走「區域線重新生成」既有的寫入路徑：單一 Transaction、自動對齊樓層高程、任一條失敗整批回復。"
