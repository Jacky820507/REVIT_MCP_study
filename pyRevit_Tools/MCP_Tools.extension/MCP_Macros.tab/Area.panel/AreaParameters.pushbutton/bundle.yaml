title: "新增Area基本參數"
tooltip: "一鍵建立 Area 工作流需要的專案參數（棟別、戶別、分類、權屬、公設分攤）並綁定到「面積」品類——其他 Area 按鈕（面積計算式、專有共用面積類型）都要求這些參數先存在。每個名稱都可在建立前改，留空白＝不建立。**共用參數的身分是 GUID 不是名稱**：兩個專案各自用隨機 GUID 建一個「戶別」，在對話框裡看起來一樣但不是同一個參數，無法一起排程、標籤不一致、IFC 匯出對應也不同。因此工具自建定義時 **GUID 由名稱推導**，同名在每個專案都是同一個共用參數。若貴單位已有共用參數檔，選「從共用參數檔挑」更好——那裡的 GUID 才是你們的標準。資料型別是唯一真的分版的地方：2020 用 `ParameterType`，2021+ 用 `SpecTypeId`（Text 在 String 下、YesNo 在 Boolean 下），以探測而非版號決定。`SharedParametersFilename` 是 session 全域設定，用完在 finally 還原並刪暫存檔。目標已有同名參數者略過。dry-run 預覽後才建立，單一 Transaction 全有全無。"
