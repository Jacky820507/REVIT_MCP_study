title: "CAD對齊\n網格匯入"
tooltip: "批次把資料夾中的 CAD（DWG／DXF）放進多個平面視圖並自動對齊 Revit 網格。選視圖（多選）→選 CAD（多選）→依名稱樓層自動配對（一層＝1F、地下一層＝B1、屋頂＝RF，預覽可改）→選匯入或連結。固定「僅目前視圖＋自動判斷單位＋原點對原點」，再讀 CAD 軸線圖層（預設 S-GRID）算平移：能讀到軸號（S-GRID-IDEN，需 Python+ezdxf，DWG 另需 ODA File Converter）時以同名軸號為準，否則用軸距序列比對；CAD 被旋轉或等距軸網有歧義時該筆不放置並說明。對齊後可 Pin；視圖已有同名 CAD 會略過。全部先試跑，確認後保留或整批復原，並輸出 CSV 報告到 CAD 資料夾。"
